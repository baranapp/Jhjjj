<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>باران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
body{font-family:Vazirmatn;background:#fff;margin:0}
.container{text-align:center;padding:40px}
.logo{width:90px}
.password-box{margin:20px auto;display:flex;max-width:300px;border:1px solid #ddd;border-radius:12px;padding:10px}
.password-box input{flex:1;border:0;text-align:center}
.login-btn,.btn-download{background:#00856b;color:#fff;border:0;border-radius:12px;padding:12px;width:300px}
.modal-overlay{display:none;position:fixed;inset:0;background:#0009;backdrop-filter:blur(5px);justify-content:center;align-items:center}
.custom-modal{background:#fff;width:85%;max-width:350px;border-radius:25px;padding:30px;text-align:center}
.modal-icon{font-size:50px;color:#00856b}
.pass-input{width:90%;padding:12px;margin:15px;border-radius:10px;border:1px solid #ddd;text-align:center}
#resetBtn{display:none}
</style>
</head>
<body>

<div id="main-content">
<div class="container">
<img src="logo.png" class="logo">
<h2>سوپر اپلیکیشن باران</h2>
<p>رمز عبور خود را وارد نمایید</p>

<div class="password-box">
<i class="fa-solid fa-eye-slash" id="togglePassword"></i>
<input id="password" type="password" placeholder="رمز عبور">
<i class="fa-solid fa-lock"></i>
</div>

<button class="login-btn" id="loginBtn">ورود</button>
</div>
</div>

<div id="downloadModal" class="modal-overlay">
<div class="custom-modal">
<i class="fa-solid fa-cloud-arrow-down modal-icon"></i>
<h2>نسخه جدید برنامه</h2>
<p>برای تجربه امکانات جدید، نسخه را دریافت کنید.</p>
<button class="btn-download" id="btnGetNewVersion">دریافت نسخه جدید</button>
<div id="openBioModal"><i class="fa-solid fa-fingerprint"></i></div>
</div>
</div>

<div id="bioModal" class="modal-overlay">
<div class="custom-modal">
<i class="fa-solid fa-fingerprint modal-icon"></i>
<h2>احراز هویت بیومتریک</h2>
<input id="secondPassInput" class="pass-input" placeholder="رمز عبور">
<button class="btn-download" id="btnVerifySecond">تایید</button>
<div id="resultText"></div>

<button id="resetBtn" style="margin-top:15px;background:#d32f2f;color:#fff;border:0;border-radius:10px;padding:12px;width:100%">
ریست
</button>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
