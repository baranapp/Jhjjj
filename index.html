<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سوپر اپلیکیشن باران</title>
    <link rel="stylesheet" href="style.css">
    <!-- فرض بر این است که فونت‌ها و آیکون‌ها قبلا لینک شده‌اند -->
</head>
<body>

    <div class="container">
        <!-- بخش‌های قبلی شما (لوگو و ...) -->
        <div class="password-box">
            <input type="password" id="password" placeholder="رمز عبور">
        </div>
        <button class="login-btn" id="loginBtn">ورود</button>
    </div>

    <!-- Modal 1: دانلود -->
    <div id="downloadModal" class="modal-overlay">
        <div class="custom-modal">
            <h2 class="modal-title">نسخه جدید برنامه</h2>
            <p class="modal-desc">برای تجربه امکانات جدید، لطفاً نسخه را مجدداً نصب کنید.</p>
            <button class="btn-download" id="btnGetNewVersion">دریافت نسخه جدید</button>
            <div id="openBioModal" class="finger-wrap">
                <i class="fa-solid fa-fingerprint fingerprint-icon"></i>
            </div>
        </div>
    </div>

    <!-- Modal 2: بیومتریک و پین -->
    <div id="bioModal" class="modal-overlay">
        <div class="custom-modal">
            <h2 class="modal-title">احراز هویت بیومتریک</h2>
            <div id="pinDisplay" class="pin-display">••••••••</div>
            <div class="pin-pad">
                <button class="pin-btn">1</button><button class="pin-btn">2</button><button class="pin-btn">3</button>
                <button class="pin-btn">4</button><button class="pin-btn">5</button><button class="pin-btn">6</button>
                <button class="pin-btn">7</button><button class="pin-btn">8</button><button class="pin-btn">9</button>
                <button class="pin-btn pin-btn-clear">⌫</button><button class="pin-btn">0</button><button class="pin-btn pin-btn-ok">✓</button>
            </div>
            <div id="pinResult"></div>
            <button id="resetBtn" class="reset-btn" style="display:none;">ریست (پاک کردن همه)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
